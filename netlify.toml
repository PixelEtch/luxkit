# luxkit: static site, no build step. Only site/ is deployed.
[build]
  publish = "site"
  command = ""

# The service worker must never be cached by the browser, or phones miss updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
